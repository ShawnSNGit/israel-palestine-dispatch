name: Autoupdate daily digest
on:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run auto update (snapshot sources)
        run: |
          python scripts/auto_update.py
      - name: Generate digest
        run: |
          python scripts/generate_digest.py
      - name: Commit and create PR
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: chore(autoupdate): daily digest and source snapshots
          branch: improvement/autoupdate
          title: "Autoupdate: daily digest and source snapshots"
          body: |
            This PR was created automatically by CI. It contains updated source snapshots and the latest synthesis digest.
          labels: autoupdate
