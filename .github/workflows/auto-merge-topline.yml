name: Auto-merge improvement/topline to main
on:
  push:
    branches: [ improvement/topline ]

permissions:
  contents: write

jobs:
  check-and-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -d services/editor-ui ]; then
            cd services/editor-ui
            if [ -f package-lock.json ] || [ -f yarn.lock ]; then npm ci; else npm install; fi
            cd -
          fi

      - name: Run provenance validation
        run: |
          if [ -f scripts/validate_provenance.py ]; then python scripts/validate_provenance.py; else echo "no provenance validator present"; fi

      - name: Run link check
        run: |
          if [ -f scripts/link_check.py ]; then python scripts/link_check.py; else echo "no link checker present"; fi

      - name: Build editor UI
        run: |
          if [ -d services/editor-ui ]; then cd services/editor-ui && npm run build; fi

      - name: Merge improvement/topline into main
        uses: actions/github-script@v6
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            try {
              const res = await github.rest.repos.merge({ owner, repo, base: 'main', head: 'improvement/topline' });
              core.info(`Merge result: merged=${res.data.merged}, sha=${res.data.sha}`);
            } catch (err) {
              core.setFailed(`Merge failed: ${err.message}`);
            }
